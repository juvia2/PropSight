services:
  db:
    image: postgis/postgis:latest
    platform: linux/amd64
    environment:
      POSTGRES_DB: propsight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - propsight_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d propsight']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  propsight_postgis:
